<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>css positioning</title>
    </head>
    <body>
        <link rel="stylesheet" href="csspositioning.css">
        <button>Dhuddu</button>
        <section id="one">
            <header class="blue">Earn money</header>
            <h2>One</h2>
        </section>
        <section id="two">
            <header class="red">Grow money</header>
            <h2>Two</h2>    
        </section>  
        <section id="three">
            <header class="green">Give money</header>
            <h2>Three</h2>
        </section>
        <footer>
                <section class="1one"><a href="#one">One</a></section> 
                <section class="2two"><a href="#two">Two</a></section> 
                <section class="3three"><a href="#three">Three</a></section>
        </footer>
    </body>
</html>
